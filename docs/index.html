<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#e94560">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="vienna-192.png">
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
    </script>    
    <title>Vienna – Logical Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #12121f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 0.3rem; touch-action: pan-y; user-select: none;
        }
        .app {
            width: 100%; max-width: 480px; background: #1e1e30; border-radius: 1.2rem;
            box-shadow: 0 12px 28px rgba(0,0,0,0.7); padding: 0.7rem 0.5rem 0.8rem;
            display: flex; flex-direction: column; gap: 0.5rem;
        }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 0.3rem; }
        h1 {
            font-size: 1.1rem; font-weight: 700;
            background: linear-gradient(135deg, #f39c12, #e94560);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .button-group { display: flex; gap: 0.3rem; }
        button {
            background: #34344a; border: none; color: #ddd; font-weight: 600;
            padding: 0.3rem 0.7rem; border-radius: 1.2rem; font-size: 0.7rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        button:disabled { opacity: 0.3; pointer-events: none; }
        .reset-btn { background: #b03a48; color: white; }
        
        .player-config {
            background: #1a1a2e; border-radius: 0.8rem; padding: 0.4rem;
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 0.4rem; border: 1px solid #404060;
        }
        .player-input {
            width: 100%; padding: 0.6rem 0.2rem; font-weight: 800;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 0.5rem; 
            color: white; outline: none; font-size: 0.7rem; text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            transition: all 0.2s;
        }
        .player-input::placeholder { color: rgba(255,255,255,0.4); font-weight: 400; font-size: 0.6rem; }
        .player-input:focus { border-color: #fff; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }

        .table-wrapper { border-radius: 0.7rem; border: 1px solid #404060; overflow: auto; background: #14142a; }
        table { width: 100%; border-collapse: collapse; font-size: 0.7rem; table-layout: fixed; }
        thead th { background: #26263e; padding: 0.5rem 0; color: #ccc; border-bottom: 2px solid #505070; position: sticky; top: 0; z-index: 2; }
        
        tbody td { padding: 0; border: 1px solid #3a3a52; vertical-align: middle; }
        .suspect-cell { text-align: center; font-weight: 800; font-size: 0.85rem; background: #20203a; color: #f7c873; width: 40px; }
        .grid-cell { background: #14142a; height: 52px; padding: 3px; }
        .player-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; height: 100%; gap: 3px; }
        
        .solved-row { height: 32px; cursor: pointer; }
        .solved-cell-text { font-size: 0.8rem; font-weight: bold; padding-left: 12px; color: #fff; }
        
        .row-none { background: #5a1a1a !important; } 
        .row-none .solved-cell-text { color: #ffb3b3; font-style: italic; }
        .row-none .suspect-cell { background: #7a2020 !important; color: #ffcccc !important; text-decoration: line-through; }

        .quadrant {
            display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
            font-weight: 700; font-size: 0.7rem; border-radius: 4px; background: #23233a;
            color: #fff; transition: 0.2s; border: 1px solid #333; gap: 1px; padding: 1px;
            overflow: hidden; position: relative;
        }
        .quad-disabled { opacity: 0.05; background: #000; pointer-events: none; border: none; }
        .state-has-not { background: #4d2a2a; color: #ff6b6b; border-color: #c0392b; font-size: 0.9rem; }
        
        .group-badge {
            min-width: 14px; height: 14px; padding: 0 2px; border-radius: 2px; 
            font-weight: 800; font-size: 7px; color: white; 
            display: flex; align-items: center; justify-content: center; 
            text-shadow: 0 1px 1px black; border: 1px solid rgba(255,255,255,0.2);
        }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal { background: #252538; padding: 1.2rem; border-radius: 1.2rem; width: 92%; max-width: 400px; color: #ddd; border: 1px solid #e94560; }
        .type-selector { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; }
        .type-btn {
            flex: 1; padding: 0.6rem 0.2rem; border-radius: 0.6rem; background: #34344a; 
            color: #888; border: 2px solid transparent; font-size: 0.75rem; font-weight: bold;
        }
        .type-btn.active {
            background: #e94560; color: white; border-color: white;
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.6); transform: scale(1.05);
        }

        .chip-grid { display: flex; flex-wrap: wrap; gap: 4px; margin: 0.8rem 0; max-height: 160px; overflow-y: auto; }
        .chip {
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            font-weight: 700; background: #3a3a50; border-radius: 8px; border: 2px solid #555;
        }
        .chip.selected { background: #e94560; border-color: white; color: white; }
        .chip.fixed { opacity: 0.3; }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>🕵️ Black Vienna Pro</h1>
        <div class="button-group">
            <button id="undoBtn" disabled>↩️</button>
            <button id="redoBtn" disabled>↪️</button>
            <button class="reset-btn" id="resetBtn">🗑️</button>
        </div>
    </div>
    <div class="player-config" id="playerConfig"></div>
    <div class="table-wrapper">
        <table id="mainTable">
            <thead>
                <tr><th style="width:40px">V</th><th>Logik-Matrix (L: Nicht | R: Hat)</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3 id="modalTitle">Neue Gruppe</h3>
        <div class="button-group" style="margin-bottom: 15px;">
            <button onclick="setGType('one_of_two')" id="btn-one_of_two" class="type-btn">1 von 2</button>
            <button onclick="setGType('one_of_three')" id="btn-one_of_three" class="type-btn">1 von 3</button>
            <button onclick="setGType('two_of_three')" id="btn-two_of_three" class="type-btn">2 von 3</button>
        </div>
        <div class="chip-grid" id="chipGrid"></div>
        <div class="modal-actions">
            <button id="cancelModalBtn">Abbrechen</button>
            <button id="confirmModalBtn" style="background:#e94560; color:white;">Bestätigen</button>
        </div>
    </div>
</div>

<script>
    (() => {
        const SUSPECTS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÖ'.split('');
        const NUM_PLAYERS = 4;
        const STORAGE_KEY = 'vienna_pro_v7_empty_start';
        const P_COLORS = ['#e67e22', '#3498db', '#2ecc71', '#9b59b6'];
        const GROUP_COLORS = ['#e74c3c', '#f1c40f', '#1abc9c', '#e84393', '#00b894', '#6c5ce7', '#00cec9'];

        let data = { 
            players: [], 
            playerNames: ['', '', '', ''], 
            nextGroupId: 1, 
            usedColors: [] 
        };
        let undoStack = [], redoStack = [];
        let currentGType = 'one_of_two';

        function initData() {
            data.players = Array.from({length: NUM_PLAYERS}, () => 
                Array.from({length: SUSPECTS.length}, () => ({ explicit: 'unknown', groups: [] }))
            );
            data.playerNames = ['', '', '', ''];
            data.nextGroupId = 1; data.usedColors = [];
            save(); renderConfig(); render();
        }

        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
        function pushHistory() { undoStack.push(JSON.parse(JSON.stringify(data))); redoStack = []; }

        function getActivePlayers() {
            return data.playerNames.map((n, i) => n.trim() !== '' ? i : null).filter(x => x !== null);
        }

        function removeGroup(pIdx, gId) {
            data.players[pIdx].forEach(s => s.groups = s.groups.filter(g => g.id !== gId));
        }

        function applyInference(pIdx, sIdx) {
            const player = data.players[pIdx];
            const entry = player[sIdx];
            if (!entry || entry.explicit === 'unknown') return;

            if (entry.explicit === 'has') {
                data.players.forEach((otherP, opIdx) => {
                    if (opIdx !== pIdx && otherP[sIdx].explicit !== 'has_not') {
                        otherP[sIdx].explicit = 'has_not';
                        [...otherP[sIdx].groups].forEach(g => removeGroup(opIdx, g.id));
                        applyInference(opIdx, sIdx);
                    }
                });
            }

            [...entry.groups].forEach(g => {
                const members = g.members.filter(m => m !== sIdx);
                removeGroup(pIdx, g.id);
                if (g.type === 'one_of_two' && members.length === 1) {
                    const target = members[0];
                    const newState = (entry.explicit === 'has') ? 'has_not' : 'has';
                    if (player[target].explicit === 'unknown') {
                        player[target].explicit = newState;
                        applyInference(pIdx, target);
                    }
                } else if (g.type === 'one_of_three') {
                    if (entry.explicit === 'has') {
                        members.forEach(m => { if(player[m].explicit === 'unknown') { player[m].explicit = 'has_not'; applyInference(pIdx, m); }});
                    } else if (entry.explicit === 'has_not') {
                        const newG = { id: data.nextGroupId++, type: 'one_of_two', members, color: g.color };
                        members.forEach(m => player[m].groups.push(newG));
                    }
                } else if (g.type === 'two_of_three') {
                    if (entry.explicit === 'has_not') {
                        members.forEach(m => { if(player[m].explicit === 'unknown') { player[m].explicit = 'has'; applyInference(pIdx, m); }});
                    } else if (entry.explicit === 'has') {
                        const newG = { id: data.nextGroupId++, type: 'one_of_two', members, color: g.color };
                        members.forEach(m => player[m].groups.push(newG));
                    }
                }
            });
        }

        function render() {
            const container = document.getElementById('tableBody');
            container.innerHTML = '';
            const activeIndices = getActivePlayers();

            SUSPECTS.forEach((sName, sIdx) => {
                let ownerIdx = -1; 
                let allNot = activeIndices.length > 0;

                activeIndices.forEach(p => {
                    const state = data.players[p][sIdx].explicit;
                    if(state === 'has') ownerIdx = p;
                    if(state !== 'has_not') allNot = false;
                });

                const tr = document.createElement('tr');
                if (ownerIdx !== -1) {
                    tr.className = 'solved-row row-has';
                    tr.style.background = P_COLORS[ownerIdx];
                    tr.innerHTML = `<td class="suspect-cell">${sName}</td><td class="solved-cell-text">✔️ ${data.playerNames[ownerIdx]} hat ${sName}</td>`;
                    tr.onclick = () => { pushHistory(); data.players[ownerIdx][sIdx].explicit = 'unknown'; save(); render(); };
                } else if (allNot) {
                    tr.className = 'solved-row row-none';
                    tr.innerHTML = `<td class="suspect-cell">${sName}</td><td class="solved-cell-text">✖ Niemand hat ${sName}</td>`;
                    tr.onclick = () => { pushHistory(); activeIndices.forEach(p => data.players[p][sIdx].explicit = 'unknown'); save(); render(); };
                } else {
                    tr.innerHTML = `<td class="suspect-cell">${sName}</td><td class="grid-cell"><div class="player-grid"></div></td>`;
                    const grid = tr.querySelector('.player-grid');
                    for(let pIdx=0; pIdx<NUM_PLAYERS; pIdx++) {
                        const quad = document.createElement('div');
                        const isActive = data.playerNames[pIdx].trim() !== '';
                        
                        if(!isActive) {
                            quad.className = 'quadrant quad-disabled';
                        } else {
                            const entry = data.players[pIdx][sIdx];
                            quad.className = 'quadrant' + (entry.explicit === 'has_not' ? ' state-has-not' : '');
                            quad.style.borderColor = P_COLORS[pIdx];
                            
                            if(entry.explicit === 'has_not') {
                                quad.textContent = '✕';
                            } else {
                                entry.groups.forEach(g => {
                                    const b = document.createElement('div'); b.className = 'group-badge';
                                    b.style.background = g.color; b.textContent = (g.type === 'two_of_three' ? '2' : '1') + g.members.map(m => SUSPECTS[m]).join('');
                                    quad.appendChild(b);
                                });
                            }
                            attachEvents(quad, pIdx, sIdx);
                        }
                        grid.appendChild(quad);
                    }
                }
                container.appendChild(tr);
            });
            updateButtons();
        }

        function attachEvents(el, p, s) {
            let timer, isMoving = false;
            el.onpointerdown = (e) => { 
                isMoving = false; 
                timer = setTimeout(() => { if(!isMoving) openModal(p, s); }, 600); 
            };
            el.onpointermove = () => { isMoving = true; clearTimeout(timer); };
            el.onpointerup = (e) => {
                clearTimeout(timer); if(isMoving) return;
                const rect = el.getBoundingClientRect();
                const x = e.clientX - rect.left;
                pushHistory();
                if (x < rect.width * 0.4) data.players[p][s].explicit = 'has_not';
                else if (x > rect.width * 0.6) data.players[p][s].explicit = 'has';
                else data.players[p][s].explicit = 'unknown';
                applyInference(p, s);
                save();
                requestAnimationFrame(() => render());
            };
        }

        function renderConfig() {
            const pConf = document.getElementById('playerConfig');
            pConf.innerHTML = '';
            data.playerNames.forEach((n, i) => {
                const inp = document.createElement('input');
                inp.className = 'player-input';
                inp.style.background = P_COLORS[i];
                inp.value = n;
                inp.placeholder = `Name P${i+1}`;
                inp.oninput = (e) => { 
                    data.playerNames[i] = e.target.value; 
                    save(); render(); 
                };
                pConf.appendChild(inp);
            });
        }

        window.setGType = (t) => {
            currentGType = t;
            ['btn-1-2', 'btn-1-3', 'btn-2-3'].forEach(id => {
                document.getElementById(id).style.background = id.includes(t.replace(/_/g, '-')) ? '#e94560' : '#34344a';
            });
        };

        const overlay = document.getElementById('modalOverlay');
        let selP, selS, selExtra = new Set();

        function openModal(p, s) {
            selP = p; selS = s; selExtra.clear();
            setGType('one_of_two');
            document.getElementById('modalTitle').textContent = `${data.playerNames[p]}: Gruppe (${SUSPECTS[s]})`;
            const grid = document.getElementById('chipGrid'); grid.innerHTML = '';
            SUSPECTS.forEach((n, i) => {
                const c = document.createElement('div'); c.className = 'chip' + (i===s?' fixed':''); c.textContent = n;
                if(i!==s) c.onclick = () => { 
                    if(selExtra.has(i)) selExtra.delete(i); else selExtra.add(i); 
                    Array.from(grid.children).forEach((ch, idx) => ch.classList.toggle('selected', selExtra.has(idx))); 
                };
                grid.appendChild(c);
            });
            overlay.classList.add('active');
        }

        document.getElementById('confirmModalBtn').onclick = () => {
            const req = currentGType === 'one_of_two' ? 1 : 2;
            if(selExtra.size !== req) return alert(`Wähle genau ${req} weitere Buchstaben.`);
            pushHistory();
            const members = [selS, ...selExtra].sort((a,b) => a-b);
            const color = GROUP_COLORS.find(c => !data.usedColors.includes(c)) || '#555';
            data.usedColors.push(color);
            const g = { id: data.nextGroupId++, type: currentGType, members, color };
            members.forEach(m => { 
                data.players[selP][m].groups.push(g); 
                applyInference(selP, m); 
            });
            overlay.classList.remove('active'); save(); render();
        };

        function updateButtons() {
            document.getElementById('undoBtn').disabled = !undoStack.length;
            document.getElementById('redoBtn').disabled = !redoStack.length;
        }

        document.getElementById('cancelModalBtn').onclick = () => overlay.classList.remove('active');
        document.getElementById('resetBtn').onclick = () => confirm('Spielstand wirklich löschen?') && initData();
        document.getElementById('undoBtn').onclick = () => { redoStack.push(JSON.parse(JSON.stringify(data))); data = undoStack.pop(); render(); };
        document.getElementById('redoBtn').onclick = () => { undoStack.push(JSON.parse(JSON.stringify(data))); data = redoStack.pop(); render(); };

        const saved = localStorage.getItem(STORAGE_KEY);
        if(saved) data = JSON.parse(saved); else initData();
        
        renderConfig();
        render();
    })();
</script>
</body>
</html>
